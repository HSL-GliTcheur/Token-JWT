<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <script>
        async function login(email, password) {
    try {
        const response = await fetch("http://jwt.test/api/login.php", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                email: email,
                password: password
            })
        });

        if (!response.ok) {
            throw new Error("Identifiants incorrects");
        }

        const data = await response.json();

        // Exemple de réponse :
        // { "token": "eyJhbGciOiJIUzI1NiIs..." }

        const token = data.token;

        if (!token) {
            throw new Error("Token JWT absent de la réponse");
        }

        // Conserver le token
        localStorage.setItem("jwt", token);

        console.log("Connexion réussie");

        // Tester immédiatement la connexion
        return await getMe();

    } catch (error) {
        console.error("Erreur de connexion :", error);
        return null;
    }
}


async function getMe() {
    const token = localStorage.getItem("jwt");

    if (!token) {
        console.log("Pas de token, utilisateur non connecté");
        return null;
    }

    try {
        const response = await fetch("http://jwt.test/api/me.php", {
            method: "GET",
            headers: {
                "Authorization": `Bearer ${token}`,
                "Accept": "application/json"
            }
        });

        if (response.status === 401) {
            // Token invalide ou expiré
            localStorage.removeItem("jwt");
            console.log("Session expirée");
            return null;
        }

        if (!response.ok) {
            throw new Error(`Erreur HTTP ${response.status}`);
        }

        const user = await response.json();

        console.log("Utilisateur connecté :", user);

        return user;

    } catch (error) {
        console.error("Erreur me.php :", error);
        return null;
    }
}


    </script>
</body>

</html>
